[build]
  command = "npm install && npm run build --workspace=packages/bolt-core-browser && npm run build --workspace=packages/localbolt-browser && npm run build --workspace=packages/localbolt-core && npm run build --workspace=packages/localbolt-web"
  publish = "packages/localbolt-web/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[redirects]]
  from = "/download/macos/apple-silicon"
  to = "https://github.com/bolt-ecosystem/localbolt-native/releases/download/localbolt-app-v2.0.3/LocalBolt-2.0.3-arm64.dmg"
  status = 302

[[redirects]]
  from = "/download/macos/intel"
  to = "https://github.com/bolt-ecosystem/localbolt-native/releases/download/localbolt-app-v2.0.3/LocalBolt-2.0.3-x86_64.dmg"
  status = 302

[[redirects]]
  from = "/download/macos"
  to = "https://github.com/bolt-ecosystem/localbolt-native/releases/download/localbolt-app-v2.0.3/LocalBolt-2.0.3-arm64.dmg"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
